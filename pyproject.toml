[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apxtool"
version = "0.1.0"
description = "Experimental AppoTech JT5295 camera SCSI and loader tool"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
usb = ["pyusb>=1.3"]

[project.scripts]
apxtool = "apxtool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apxtool = ["scsiio/LICENSE"]
